book: destination-b1
book_title: Destination B1 Grammar and Vocabulary

unit:
  ordinal: 27
  code: U27
  title: Working and earning
  summary_md: Vocabulary related to work, earning, business, phrasal verbs, prepositional phrases, word formation, and word patterns.

lesson:
  ordinal: 1
  kind: vocabulary
  title: Working and earning
  slug: working-and-earning

entries:
  - id: ambition-noun
    headword: ambition
    lemma: ambition
    pos: noun
    ipa: /æmˈbɪʃn/
    cefr: B1
    tags: [work, goal, noun]
    senses:
      - definition_en: "something that you very much want to achieve"
        definition_vi: "tham vọng, hoài bão"
        register: neutral
    examples:
      - text: "His main {{ambition}} is to become a successful businessman."
        translation: "Tham vọng chính của anh ấy là trở thành một doanh nhân thành đạt."
    forms:
      - kind: plural
        text: ambitions
    collocations:
      - collocation: "achieve an ambition"
        pattern: verb+noun
      - collocation: "lifelong ambition"
        pattern: adj+noun
    relations:
      - relation: derived_from
        text: "ambitious"

  - id: application-noun
    headword: application
    lemma: application
    pos: noun
    ipa: /ˌæplɪˈkeɪʃn/
    cefr: B1
    tags: [work, process, noun]
    senses:
      - definition_en: "a formal, usually written, request for something such as a job, place at university, or permission to do something"
        definition_vi: "đơn xin (việc, học, vv)"
        register: formal
    examples:
      - text: "I sent off my {{application}} for the manager's job yesterday."
        translation: "Tôi đã gửi đơn xin việc cho vị trí quản lý vào ngày hôm qua."
    forms:
      - kind: plural
        text: applications
    collocations:
      - collocation: "job application"
        pattern: noun+noun
      - collocation: "fill out an application"
        pattern: verb+noun
    relations:
      - relation: derived_from
        text: "apply"

  - id: bank-account-phrase
    headword: bank account
    lemma: bank account
    pos: phrase
    cefr: A2
    tags: [money, finance, phrase]
    senses:
      - definition_en: "an arrangement with a bank in which the bank keeps your money safe"
        definition_vi: "tài khoản ngân hàng"
        register: neutral
    examples:
      - text: "My salary is paid directly into my {{bank account}}."
        translation: "Lương của tôi được trả trực tiếp vào tài khoản ngân hàng."
    collocations:
      - collocation: "open a bank account"
        pattern: verb+noun
      - collocation: "close a bank account"
        pattern: verb+noun

  - id: boss-noun
    headword: boss
    lemma: boss
    pos: noun
    ipa: /bɒs/
    cefr: A2
    tags: [work, people, noun]
    senses:
      - definition_en: "the person who is in charge of an organization and who tells others what to do"
        definition_vi: "sếp, ông chủ"
        register: informal
    examples:
      - text: "I'll have to ask my {{boss}} for a day off."
        translation: "Tôi sẽ phải xin sếp nghỉ một ngày."
    relations:
      - relation: derived_from
        text: "bossy"
      - relation: synonym
        text: "manager"

  - id: career-noun
    headword: career
    lemma: career
    pos: noun
    ipa: /kəˈrɪər/
    cefr: B1
    tags: [work, noun]
    senses:
      - definition_en: "the job or series of jobs that you do during your working life"
        definition_vi: "sự nghiệp"
        register: neutral
    examples:
      - text: "She wants to pursue a {{career}} in medicine."
        translation: "Cô ấy muốn theo đuổi sự nghiệp y khoa."
    collocations:
      - collocation: "successful career"
        pattern: adj+noun
      - collocation: "career path"
        pattern: noun+noun
    relations:
      - relation: synonym
        text: "profession"

  - id: colleague-noun
    headword: colleague
    lemma: colleague
    pos: noun
    ipa: /ˈkɒliːɡ/
    cefr: A2
    tags: [work, people, noun]
    senses:
      - definition_en: "one of a group of people who work together"
        definition_vi: "đồng nghiệp"
        register: neutral
    examples:
      - text: "I get along well with all my {{colleagues}} at work."
        translation: "Tôi rất hòa đồng với tất cả đồng nghiệp tại nơi làm việc."
    forms:
      - kind: plural
        text: colleagues
    relations:
      - relation: synonym
        text: "co-worker"

  - id: company-noun
    headword: company
    lemma: company
    pos: noun
    ipa: /ˈkʌmpəni/
    cefr: A2
    tags: [work, business, noun]
    senses:
      - definition_en: "an organization that sells goods or services in order to make money"
        definition_vi: "công ty"
        register: neutral
    examples:
      - text: "He works for a large software {{company}}."
        translation: "Anh ấy làm việc cho một công ty phần mềm lớn."
    forms:
      - kind: plural
        text: companies
    relations:
      - relation: synonym
        text: "firm"
      - relation: synonym
        text: "business"

  - id: contract-noun
    headword: contract
    lemma: contract
    pos: noun
    ipa: /ˈkɒntrækt/
    cefr: B1
    tags: [work, law, noun]
    senses:
      - definition_en: "a legal document that states and explains a formal agreement between two different people or groups"
        definition_vi: "hợp đồng"
        register: formal
    examples:
      - text: "Make sure you read the {{contract}} carefully before signing."
        translation: "Hãy chắc chắn rằng bạn đọc kỹ hợp đồng trước khi ký."
    forms:
      - kind: plural
        text: contracts
    collocations:
      - collocation: "sign a contract"
        pattern: verb+noun
      - collocation: "employment contract"
        pattern: noun+noun

  - id: department-noun
    headword: department
    lemma: department
    pos: noun
    ipa: /dɪˈpɑːtmənt/
    cefr: A2
    tags: [work, organization, noun]
    senses:
      - definition_en: "a part of an organization such as a school, business, or government that deals with a particular area of study or work"
        definition_vi: "phòng ban, bộ phận"
        register: neutral
    examples:
      - text: "She is the head of the marketing {{department}}."
        translation: "Cô ấy là trưởng bộ phận marketing."
    forms:
      - kind: plural
        text: departments

  - id: deserve-verb
    headword: deserve
    lemma: deserve
    pos: verb
    ipa: /dɪˈzɜːv/
    cefr: B1
    tags: [work, reward, verb]
    senses:
      - definition_en: "to have earned or to be given something because of the way you have behaved or the qualities you have"
        definition_vi: "xứng đáng"
        register: neutral
    examples:
      - text: "After all that hard work, you {{deserve}} a holiday."
        translation: "Sau tất cả những công việc khó khăn đó, bạn xứng đáng có một kỳ nghỉ."
    forms:
      - kind: past
        text: deserved
      - kind: past_participle
        text: deserved
      - kind: gerund
        text: deserving
      - kind: third_person
        text: deserves
    collocations:
      - collocation: "well deserved"
        pattern: adv+verb

  - id: earn-verb
    headword: earn
    lemma: earn
    pos: verb
    ipa: /ɜːn/
    cefr: A2
    tags: [work, money, verb]
    senses:
      - definition_en: "to receive money as payment for work that you do"
        definition_vi: "kiếm được (tiền)"
        register: neutral
    examples:
      - text: "How much do you {{earn}} in your new job?"
        translation: "Bạn kiếm được bao nhiêu trong công việc mới?"
    forms:
      - kind: past
        text: earned
      - kind: gerund
        text: earning
      - kind: third_person
        text: earns
    collocations:
      - collocation: "earn a living"
        pattern: verb+noun
      - collocation: "earn money"
        pattern: verb+noun
    relations:
      - relation: derived_from
        text: "earnings"

  - id: fame-noun
    headword: fame
    lemma: fame
    pos: noun
    ipa: /feɪm/
    cefr: B1
    tags: [success, noun]
    senses:
      - definition_en: "the state of being known or recognized by many people because of your achievements, skills, etc."
        definition_vi: "sự nổi tiếng, danh tiếng"
        register: neutral
    examples:
      - text: "She moved to Hollywood in search of wealth and {{fame}}."
        translation: "Cô chuyển đến Hollywood để tìm kiếm sự giàu có và danh tiếng."
    relations:
      - relation: derived_from
        text: "famous"

  - id: goal-noun
    headword: goal
    lemma: goal
    pos: noun
    ipa: /ɡəʊl/
    cefr: A2
    tags: [work, ambition, noun]
    senses:
      - definition_en: "an aim or purpose"
        definition_vi: "mục tiêu"
        register: neutral
    examples:
      - text: "His main {{goal}} in life is to become a doctor."
        translation: "Mục tiêu chính của anh ấy trong cuộc sống là trở thành một bác sĩ."
    forms:
      - kind: plural
        text: goals
    collocations:
      - collocation: "achieve a goal"
        pattern: verb+noun
      - collocation: "set a goal"
        pattern: verb+noun

  - id: impress-verb
    headword: impress
    lemma: impress
    pos: verb
    ipa: /ɪmˈpres/
    cefr: B1
    tags: [emotion, verb]
    senses:
      - definition_en: "to cause someone to admire or respect you"
        definition_vi: "gây ấn tượng"
        register: neutral
    examples:
      - text: "He tried to {{impress}} the interviewers with his knowledge."
        translation: "Anh ấy đã cố gắng gây ấn tượng với những người phỏng vấn bằng kiến thức của mình."
    forms:
      - kind: past
        text: impressed
      - kind: gerund
        text: impressing
      - kind: third_person
        text: impresses
    relations:
      - relation: derived_from
        text: "impression"
      - relation: derived_from
        text: "impressive"

  - id: income-noun
    headword: income
    lemma: income
    pos: noun
    ipa: /ˈɪnkʌm/
    cefr: B1
    tags: [work, money, noun]
    senses:
      - definition_en: "money that is earned from doing work or received from investments"
        definition_vi: "thu nhập"
        register: neutral
    examples:
      - text: "The family has a very low {{income}}."
        translation: "Gia đình có thu nhập rất thấp."
    forms:
      - kind: plural
        text: incomes
    collocations:
      - collocation: "high income"
        pattern: adj+noun
      - collocation: "source of income"
        pattern: noun+noun

  - id: industry-noun
    headword: industry
    lemma: industry
    pos: noun
    ipa: /ˈɪndəstri/
    cefr: B1
    tags: [work, business, noun]
    senses:
      - definition_en: "the companies and activities involved in the process of producing goods for sale"
        definition_vi: "công nghiệp, ngành công nghiệp"
        register: neutral
    examples:
      - text: "He works in the tourism {{industry}}."
        translation: "Anh ấy làm việc trong ngành du lịch."
    forms:
      - kind: plural
        text: industries
    relations:
      - relation: derived_from
        text: "industrial"

  - id: interview-noun
    headword: interview
    lemma: interview
    pos: noun
    ipa: /ˈɪntəvjuː/
    cefr: A2
    tags: [work, noun]
    senses:
      - definition_en: "a formal meeting in which someone asks you questions to see if you are suitable for a job"
        definition_vi: "cuộc phỏng vấn"
        register: neutral
    examples:
      - text: "I had a job {{interview}} yesterday."
        translation: "Tôi đã có một cuộc phỏng vấn việc làm ngày hôm qua."
    forms:
      - kind: plural
        text: interviews
    collocations:
      - collocation: "job interview"
        pattern: noun+noun
    relations:
      - relation: derived_from
        text: "interviewer"
      - relation: derived_from
        text: "interviewee"

  - id: leader-noun
    headword: leader
    lemma: leader
    pos: noun
    ipa: /ˈliːdə(r)/
    cefr: A2
    tags: [work, people, noun]
    senses:
      - definition_en: "a person in control of a group, country, or situation"
        definition_vi: "lãnh đạo"
        register: neutral
    examples:
      - text: "She is a natural {{leader}}."
        translation: "Cô ấy là một nhà lãnh đạo bẩm sinh."
    forms:
      - kind: plural
        text: leaders
    relations:
      - relation: derived_from
        text: "lead"
      - relation: derived_from
        text: "leadership"

  - id: manager-noun
    headword: manager
    lemma: manager
    pos: noun
    ipa: /ˈmænɪdʒə(r)/
    cefr: A2
    tags: [work, people, noun]
    senses:
      - definition_en: "the person who is responsible for managing an organization"
        definition_vi: "người quản lý"
        register: neutral
    examples:
      - text: "I would like to speak to the {{manager}}, please."
        translation: "Tôi muốn nói chuyện với người quản lý."
    forms:
      - kind: plural
        text: managers
    relations:
      - relation: derived_from
        text: "manage"
      - relation: synonym
        text: "boss"

  - id: pension-noun
    headword: pension
    lemma: pension
    pos: noun
    ipa: /ˈpenʃn/
    cefr: B1
    tags: [work, money, noun]
    senses:
      - definition_en: "an amount of money paid regularly by the government or a private company to a person who does not work any more because they are too old or they are ill"
        definition_vi: "lương hưu"
        register: neutral
    examples:
      - text: "He is now living on a state {{pension}}."
        translation: "Anh ấy hiện đang sống bằng lương hưu của nhà nước."
    forms:
      - kind: plural
        text: pensions
    collocations:
      - collocation: "state pension"
        pattern: noun+noun
      - collocation: "draw a pension"
        pattern: verb+noun
    relations:
      - relation: derived_from
        text: "pensioner"

  - id: poverty-noun
    headword: poverty
    lemma: poverty
    pos: noun
    ipa: /ˈpɒvəti/
    cefr: B1
    tags: [money, noun]
    senses:
      - definition_en: "the condition of being extremely poor"
        definition_vi: "sự nghèo đói"
        register: formal
    examples:
      - text: "Many people in the world live in extreme {{poverty}}."
        translation: "Nhiều người trên thế giới sống trong cảnh nghèo đói cùng cực."
    collocations:
      - collocation: "live in poverty"
        pattern: prep+noun
    relations:
      - relation: derived_from
        text: "poor"

  - id: pressure-noun
    headword: pressure
    lemma: pressure
    pos: noun
    ipa: /ˈpreʃə(r)/
    cefr: B1
    tags: [emotion, noun]
    senses:
      - definition_en: "a difficult situation that makes you feel worried or unhappy"
        definition_vi: "áp lực"
        register: neutral
    examples:
      - text: "She is under a lot of {{pressure}} at work right now."
        translation: "Cô ấy đang chịu rất nhiều áp lực trong công việc ngay lúc này."
    collocations:
      - collocation: "under pressure"
        pattern: prep+noun
      - collocation: "put pressure on"
        pattern: verb+noun

  - id: previous-adjective
    headword: previous
    lemma: previous
    pos: adjective
    ipa: /ˈpriːviəs/
    cefr: B1
    tags: [time, adjective]
    senses:
      - definition_en: "happening or existing before something or someone else"
        definition_vi: "trước đó"
        register: neutral
    examples:
      - text: "Do you have any {{previous}} experience in this field?"
        translation: "Bạn có kinh nghiệm nào trước đó trong lĩnh vực này không?"
    collocations:
      - collocation: "previous experience"
        pattern: adj+noun
    relations:
      - relation: derived_from
        text: "previously"

  - id: profession-noun
    headword: profession
    lemma: profession
    pos: noun
    ipa: /prəˈfeʃn/
    cefr: B1
    tags: [work, noun]
    senses:
      - definition_en: "any type of work that needs special training or a particular skill"
        definition_vi: "nghề nghiệp"
        register: neutral
    examples:
      - text: "Teaching is a very demanding {{profession}}."
        translation: "Giảng dạy là một nghề rất đòi hỏi."
    forms:
      - kind: plural
        text: professions
    relations:
      - relation: synonym
        text: "career"
      - relation: derived_from
        text: "professional"

  - id: retire-verb
    headword: retire
    lemma: retire
    pos: verb
    ipa: /rɪˈtaɪə(r)/
    cefr: B1
    tags: [work, verb]
    senses:
      - definition_en: "to leave your job or stop working because of old age or ill health"
        definition_vi: "nghỉ hưu"
        register: neutral
    examples:
      - text: "My father plans to {{retire}} next year."
        translation: "Bố tôi dự định nghỉ hưu vào năm tới."
    forms:
      - kind: past
        text: retired
      - kind: gerund
        text: retiring
      - kind: third_person
        text: retires
    relations:
      - relation: derived_from
        text: "retirement"

  - id: salary-noun
    headword: salary
    lemma: salary
    pos: noun
    ipa: /ˈsæləri/
    cefr: A2
    tags: [work, money, noun]
    senses:
      - definition_en: "a fixed amount of money agreed every year as pay for an employee"
        definition_vi: "tiền lương"
        register: neutral
    examples:
      - text: "His net monthly {{salary}} is €2,500."
        translation: "Lương tháng thực nhận của anh ấy là €2.500."
    forms:
      - kind: plural
        text: salaries
    collocations:
      - collocation: "earn a salary"
        pattern: verb+noun
    relations:
      - relation: synonym
        text: "income"
      - relation: synonym
        text: "pay"

  - id: staff-noun
    headword: staff
    lemma: staff
    pos: noun
    ipa: /stɑːf/
    cefr: A2
    tags: [work, people, noun]
    senses:
      - definition_en: "the group of people who work for an organization"
        definition_vi: "nhân viên"
        register: neutral
    examples:
      - text: "The company has a highly trained {{staff}}."
        translation: "Công ty có một đội ngũ nhân viên được đào tạo chuyên sâu."
    relations:
      - relation: synonym
        text: "employees"

  - id: strike-noun
    headword: strike
    lemma: strike
    pos: noun
    ipa: /straɪk/
    cefr: B1
    tags: [work, action, noun]
    senses:
      - definition_en: "to refuse to continue working because of an argument with an employer about working conditions, pay levels, or job losses"
        definition_vi: "cuộc đình công"
        register: neutral
    examples:
      - text: "The train drivers have voted to go on {{strike}}."
        translation: "Các lái tàu đã bỏ phiếu quyết định đình công."
    forms:
      - kind: plural
        text: strikes
    collocations:
      - collocation: "go on strike"
        pattern: verb+prep

  - id: tax-noun
    headword: tax
    lemma: tax
    pos: noun
    ipa: /tæks/
    cefr: B1
    tags: [money, government, noun]
    senses:
      - definition_en: "money paid to the government that is based on your income or the cost of goods or services you have bought"
        definition_vi: "thuế"
        register: neutral
    examples:
      - text: "They are demanding to pay lower {{taxes}}."
        translation: "Họ đang yêu cầu được trả thuế thấp hơn."
    forms:
      - kind: plural
        text: taxes
    collocations:
      - collocation: "pay tax"
        pattern: verb+noun
      - collocation: "income tax"
        pattern: noun+noun

  - id: wealthy-adjective
    headword: wealthy
    lemma: wealthy
    pos: adjective
    ipa: /ˈwelθi/
    cefr: B1
    tags: [money, adjective]
    senses:
      - definition_en: "having a large amount of money or valuable possessions"
        definition_vi: "giàu có"
        register: neutral
    examples:
      - text: "He comes from a very {{wealthy}} family."
        translation: "Anh ấy xuất thân từ một gia đình rất giàu có."
    forms:
      - kind: comparative
        text: wealthier
      - kind: superlative
        text: wealthiest
    relations:
      - relation: synonym
        text: "rich"
      - relation: derived_from
        text: "wealth"

  - id: call-off-phrasal-verb
    headword: call off
    lemma: call off
    pos: phrasal_verb
    cefr: B1
    tags: [action, phrasal_verb]
    senses:
      - definition_en: "to cancel"
        definition_vi: "hủy bỏ"
        register: neutral
    examples:
      - text: "They had to {{call off}} the meeting due to the storm."
        translation: "Họ đã phải hủy bỏ cuộc họp do cơn bão."
    relations:
      - relation: synonym
        text: "cancel"

  - id: give-back-phrasal-verb
    headword: give back
    lemma: give back
    pos: phrasal_verb
    cefr: A2
    tags: [action, phrasal_verb]
    senses:
      - definition_en: "return something you have taken/borrowed"
        definition_vi: "trả lại"
        register: neutral
    examples:
      - text: "Please {{give back}} the pen when you finish."
        translation: "Làm ơn trả lại cây bút khi bạn dùng xong."
    relations:
      - relation: synonym
        text: "return"

  - id: go-on-phrasal-verb
    headword: go on
    lemma: go on
    pos: phrasal_verb
    cefr: B1
    tags: [action, phrasal_verb]
    senses:
      - definition_en: "to happen"
        definition_vi: "xảy ra, tiếp tục"
        register: neutral
    examples:
      - text: "What is {{going on}} here?"
        translation: "Chuyện gì đang xảy ra ở đây vậy?"
    relations:
      - relation: synonym
        text: "happen"

  - id: put-off-phrasal-verb
    headword: put off
    lemma: put off
    pos: phrasal_verb
    cefr: B1
    tags: [time, phrasal_verb]
    senses:
      - definition_en: "delay to a later time"
        definition_vi: "trì hoãn"
        register: neutral
    examples:
      - text: "Never {{put off}} until tomorrow what you can do today."
        translation: "Đừng bao giờ để đến ngày mai những việc bạn có thể làm hôm nay."
    relations:
      - relation: synonym
        text: "delay"
      - relation: synonym
        text: "postpone"

