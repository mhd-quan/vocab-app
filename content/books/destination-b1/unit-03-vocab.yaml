  - id: music-noun
    headword: music
    pos: noun
    ipa: /ˈmjuːzɪk/
    cefr: A1
    tags: [formation, abstract]
    senses:
      - definition_en: a pattern of sounds made by musical instruments, voices, or computers
        definition_vi: âm nhạc
        register: neutral
    relations:
