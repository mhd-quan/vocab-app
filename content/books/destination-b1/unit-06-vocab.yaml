        text: memorise
      - relation: derived_from
        text: memorial

  - id: refer-verb
    headword: refer
    pos: verb
    ipa: /rɪˈfɜː/
    cefr: B1
    tags: [formation, communication]
    senses:
      - definition_en: to look at a book or similar record in order to find information and help
        definition_vi: tham khảo, nhắc đến
        register: neutral
    relations:
      - relation: derived_from
        text: reference

