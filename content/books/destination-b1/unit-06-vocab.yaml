    headword: silent
    pos: adjective
    ipa: /ˈsaɪlənt/
    cefr: B1
    tags: [formation, description]
    senses:
      - definition_en: without any sound
        definition_vi: im lặng
        register: neutral
    relations:
      - relation: derived_from
        text: silence

  - id: simple-adjective
    headword: simple
    pos: adjective
    ipa: /ˈsɪmpl/
    cefr: A2
    tags: [formation, description]
    senses:
      - definition_en: easy to understand or do; not difficult
        definition_vi: đơn giản
        register: neutral
    relations:
      - relation: derived_from
        text: simplify
      - relation: derived_from
        text: simplicity

  # --- WORD PATTERNS (BASE WORDS) ---
  - id: capable-adjective
