        register: formal
    relations:
      - relation: derived_from
        text: instruction
      - relation: derived_from
        text: instructor

  - id: memory-noun
    headword: memory
    pos: noun
    ipa: /ˈmeməri/
    cefr: A2
    tags: [formation, mind]
