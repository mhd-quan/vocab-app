book: destination-b2
book_title: Destination B2 Grammar and Vocabulary
unit:
  ordinal: 6
  code: U06
  title: Science and technology
  summary_md: Vocabulary for Science and Technology including topic vocabulary in contrast, phrasal verbs, phrases and collocations, word patterns, and word formation.
lesson:
  ordinal: 1
  kind: vocabulary
  title: Science and technology Vocab
  slug: science-and-technology-vocab
entries:
  - id: artificial-adjective
    headword: "artificial"
    pos: adjective
    cefr: B2
    tags: [science, technology, adjective]
    senses:
      - definition_en: "not natural or real, but made by people"
        definition_vi: "nhân tạo"
    examples:
      - text: "The growers use both natural and {{artificial}} light."

  - id: false-adjective
    headword: "false"
    pos: adjective
    cefr: B2
    tags: [science, technology, adjective]
    senses:
      - definition_en: "made to look like something real"
        definition_vi: "giả"
    examples:
      - text: "I realised that the man was wearing a {{false}} beard."

  - id: natural-adjective
    headword: "natural"
    pos: adjective
    cefr: B2
    tags: [science, technology, adjective]
    senses:
      - definition_en: "existing in nature, and not produced by people"
        definition_vi: "tự nhiên"
    examples:
      - text: "This cloth is made from {{natural}} fibres."

  - id: physical-adjective
    headword: "physical"
    pos: adjective
    cefr: B2
    tags: [science, technology, adjective]
    senses:
      - definition_en: "real and able to be seen, touched or felt"
        definition_vi: "vật lý, thuộc về vật chất"
    examples:
      - text: "There was no {{physical}} evidence to connect him to the crime."

  - id: true-adjective
    headword: "true"
    pos: adjective
    cefr: B2
    tags: [science, technology, adjective]
    senses:
      - definition_en: "based on facts or on things that really happened"
        definition_vi: "thật, đúng"
    examples:
      - text: "The film is based on a {{true}} story."

  - id: accurate-adjective
    headword: "accurate"
    pos: adjective
    cefr: B2
    tags: [science, technology, adjective]
    senses:
      - definition_en: "correct in every detail and without any mistakes"
        definition_vi: "chính xác"
    examples:
      - text: "We need to get an {{accurate}} estimate of what the new building will cost."

  - id: method-noun
    headword: "method"
    pos: noun
    cefr: B2
    tags: [science, technology, noun]
    senses:
      - definition_en: "a way of doing something, especially a planned or established way"
        definition_vi: "phương pháp"
    examples:
      - text: "We developed new {{methods}} of pollution control."

  - id: way-noun
    headword: "way"
    pos: noun
    cefr: B2
    tags: [science, technology, noun]
    senses:
      - definition_en: "a method for doing something"
        definition_vi: "cách thức"
    examples:
      - text: "There are so many delicious {{ways}} you can prepare chicken."

  - id: engine-noun
    headword: "engine"
    pos: noun
    cefr: B2
    tags: [science, technology, noun]
    senses:
      - definition_en: "the part of a vehicle that makes it move"
        definition_vi: "động cơ (xe cộ)"
    examples:
      - text: "There was a problem with the car's {{engine}}."

  - id: machine-noun
    headword: "machine"
    pos: noun
    cefr: B2
    tags: [science, technology, noun]
    senses:
      - definition_en: "a piece of equipment with moving parts that does a particular job"
        definition_vi: "máy móc"
    examples:
      - text: "Sue showed him how to operate the washing {{machine}}."

  - id: motor-noun
    headword: "motor"
    pos: noun
    cefr: B2
    tags: [science, technology, noun]
    senses:
      - definition_en: "the part of a machine or vehicle that makes it work"
        definition_vi: "mô tơ, động cơ (máy)"
    examples:
      - text: "The pump is powered by an electric {{motor}}."

  - id: aim-noun
    headword: "aim"
    pos: noun
    cefr: B2
    tags: [science, technology, noun]
    senses:
      - definition_en: "the thing that you hope to achieve by doing something"
        definition_vi: "mục đích"
    examples:
      - text: "My main {{aim}} on this course is to gain confidence."

  - id: cause-noun
    headword: "cause"
    pos: noun
    cefr: B2
    tags: [science, technology, noun]
    senses:
      - definition_en: "an event, thing or person that makes something happen"
        definition_vi: "nguyên nhân"
    examples:
      - text: "The {{cause}} of death was found to be a heart attack."

  - id: reason-noun
    headword: "reason"
    pos: noun
    cefr: B2
    tags: [science, technology, noun]
    senses:
      - definition_en: "a fact, situation or intention that explains why something happened, why someone did something or why something is true"
        definition_vi: "lý do"
    examples:
      - text: "The police asked her the {{reason}} for her visit."

  - id: estimate-verb
    headword: "estimate"
    pos: verb
    cefr: B2
    tags: [science, technology, verb]
    senses:
      - definition_en: "to guess or calculate an amount or value by using available information"
        definition_vi: "ước tính"
    examples:
      - text: "It is impossible to {{estimate}} how many of the residents were affected."

  - id: calculate-verb
    headword: "calculate"
    pos: verb
    cefr: B2
    tags: [science, technology, verb]
    senses:
      - definition_en: "to discover a number or amount by using mathematics"
        definition_vi: "tính toán"
    examples:
      - text: "He {{calculates}} that the proposal would cost 4 million."

  - id: electric-adjective
    headword: "electric"
    pos: adjective
    cefr: B2
    tags: [science, technology, adjective]
    senses:
      - definition_en: "using or relating to electricity"
        definition_vi: "sử dụng điện"
    examples:
      - text: "I've just got a new {{electric}} toothbrush."

  - id: electronic-adjective
    headword: "electronic"
    pos: adjective
    cefr: B2
    tags: [science, technology, adjective]
    senses:
      - definition_en: "using electricity and extremely small electrical parts, such as microchips"
        definition_vi: "điện tử"
    examples:
      - text: "Our maths teacher said that we're allowed to use {{electronic}} calculators in the exam."

  - id: invent-verb
    headword: "invent"
    pos: verb
    cefr: B2
    tags: [science, technology, verb]
    senses:
      - definition_en: "to design or create something that did not exist before"
        definition_vi: "phát minh"
    examples:
      - text: "Alfred Nobel {{invented}} dynamite."

  - id: discover-verb
    headword: "discover"
    pos: verb
    cefr: B2
    tags: [science, technology, verb]
    senses:
      - definition_en: "to find something that was hidden or that people did not know about before"
        definition_vi: "khám phá"
      - definition_en: "to find information, a place, or an object, especially for the first time"
        definition_vi: "khám phá"
    examples:
      - text: "William Herschel {{discovered}} Uranus in 1781."
      - text: "We {{discovered}} a new path."

  - id: research-noun
    headword: "research"
    pos: noun
    cefr: B2
    tags: [science, technology, noun]
    senses:
      - definition_en: "the detailed study of something in order to discover new facts"
        definition_vi: "nghiên cứu"
    examples:
      - text: "He did some {{research}} into the causes of lung cancer."

  - id: experiment-noun
    headword: "experiment"
    pos: noun
    cefr: B2
    tags: [science, technology, noun]
    senses:
      - definition_en: "a scientific test to find out what happens to someone or something in particular conditions"
        definition_vi: "thí nghiệm"
    examples:
      - text: "Researchers now need to conduct further {{experiments}}."

  - id: progress-noun
    headword: "progress"
    pos: noun
    cefr: B2
    tags: [science, technology, noun]
    senses:
      - definition_en: "the process of developing or improving"
        definition_vi: "tiến bộ"
    examples:
      - text: "Keep me informed about the {{progress}} of the project."

  - id: development-noun
    headword: "development"
    pos: noun
    cefr: B2
    tags: [science, technology, noun]
    senses:
      - definition_en: "change, growth or improvement over a period of time"
        definition_vi: "phát triển"
    examples:
      - text: "The {{development}} in the country's economy means that more people are able to buy their own homes."

  - id: modern-adjective
    headword: "modern"
    pos: adjective
    cefr: B2
    tags: [science, technology, adjective]
    senses:
      - definition_en: "relating to or belonging to the present time"
        definition_vi: "hiện đại"
    examples:
      - text: "Modern architecture is largely characterized by its simplicity."

  - id: new-adjective
    headword: "new"
    pos: adjective
    cefr: B2
    tags: [science, technology, adjective]
    senses:
      - definition_en: "recently made, invented or developed"
        definition_vi: "mới"
    examples:
      - text: "They are going to build a {{new}} office block here."

  - id: industry-noun
    headword: "industry"
    pos: noun
    cefr: B2
    tags: [science, technology, noun]
    senses:
      - definition_en: "all the businesses involved in producing a particular type of goods or services"
        definition_vi: "công nghiệp"
    examples:
      - text: "The new tax will affect everyone in the fishing {{industry}}."

  - id: factory-noun
    headword: "factory"
    pos: noun
    cefr: B2
    tags: [science, technology, noun]
    senses:
      - definition_en: "a building where large quantities of goods are produced using machines"
        definition_vi: "nhà máy"
    examples:
      - text: "She works in a clothing {{factory}}."

  - id: award-noun
    headword: "award"
    pos: noun
    cefr: B2
    tags: [science, technology, noun]
    senses:
      - definition_en: "a prize that is given to someone who has achieved something"
        definition_vi: "giải thưởng (được trao)"
    examples:
      - text: "She won the Player of the Year {{award}}."

  - id: reward-noun
    headword: "reward"
    pos: noun
    cefr: B2
    tags: [science, technology, noun]
    senses:
      - definition_en: "something good that happens or that you receive because of something that you have done"
        definition_vi: "phần thưởng"
    examples:
      - text: "You deserve a day off as a {{reward}} for working so hard."

  - id: take-place-verb
    headword: "take place"
    pos: verb
    cefr: B2
    tags: [science, technology, verb]
    senses:
      - definition_en: "to happen"
        definition_vi: "diễn ra (có kế hoạch)"
    examples:
      - text: "The Olympics {{take place}} every four years."

  - id: occur-verb
    headword: "occur"
    pos: verb
    cefr: B2
    tags: [science, technology, verb]
    senses:
      - definition_en: "to happen"
        definition_vi: "xảy ra (bất ngờ)"
    examples:
      - text: "The police said that the accident {{occurred}} at about 4.30 pm."

  - id: break-down-phrasal_verb
    headword: "break down"
    pos: phrasal_verb
    cefr: B2
    tags: [science, technology, phrasal_verb]
    senses:
      - definition_en: "stop working (for a machine, etc)"
        definition_vi: "hỏng hóc"
    examples:
      - text: "Our car {{broke down}} on the motorway."

  - id: carry-out-phrasal_verb
    headword: "carry out"
    pos: phrasal_verb
    cefr: B2
    tags: [science, technology, phrasal_verb]
    senses:
      - definition_en: "perform an experiment, etc"
        definition_vi: "tiến hành"
    examples:
      - text: "The investigators have been {{carrying out}} tests on the pieces of plane recovered."

  - id: come-off-phrasal_verb
    headword: "come off"
    pos: phrasal_verb
    cefr: B2
    tags: [science, technology, phrasal_verb]
    senses:
      - definition_en: "succeed"
        definition_vi: "thành công"
    examples:
      - text: "Well, I think it's a stupid plan and I'll be amazed if it {{comes off}}."

  - id: come-on-phrasal_verb
    headword: "come on"
    pos: phrasal_verb
    cefr: B2
    tags: [science, technology, phrasal_verb]
    senses:
      - definition_en: "develop or make progress"
        definition_vi: "tiến triển"
    examples:
      - text: "Your piano playing is really {{coming on}}, isn't it?"

  - id: come-up-with-phrasal_verb
    headword: "come up with"
    pos: phrasal_verb
    cefr: B2
    tags: [science, technology, phrasal_verb]
    senses:
      - definition_en: "think of (an idea, a plan, etc)"
        definition_vi: "nghĩ ra"
    examples:
      - text: "She's {{come up with}} some amazing scheme to double her income."

  - id: cut-off-phrasal_verb
    headword: "cut off"
    pos: phrasal_verb
    cefr: B2
    tags: [science, technology, phrasal_verb]
    senses:
      - definition_en: "stop the supply of sth"
        definition_vi: "cắt (nguồn cung cấp)"
    examples:
      - text: "Pay the electricity bill tomorrow or they might {{cut us off}}."

  - id: find-out-phrasal_verb
    headword: "find out"
    pos: phrasal_verb
    cefr: B2
    tags: [science, technology, phrasal_verb]
    senses:
      - definition_en: "discover information, etc"
        definition_vi: "tìm ra, phát hiện ra"
    examples:
      - text: "I've always wanted to {{find out}} more about the ancient Egyptians."

  - id: give-off-phrasal_verb
    headword: "give off"
    pos: phrasal_verb
    cefr: B2
    tags: [science, technology, phrasal_verb]
    senses:
      - definition_en: "produce sth such as heat or a smell"
        definition_vi: "tỏa ra (nhiệt, mùi)"
    examples:
      - text: "The fridge gets hot next to the cooker because it {{gives off}} a lot of heat."

  - id: narrow-down-phrasal_verb
    headword: "narrow down"
    pos: phrasal_verb
    cefr: B2
    tags: [science, technology, phrasal_verb]
    senses:
      - definition_en: "reduce the number of possibilities"
        definition_vi: "thu hẹp (lựa chọn)"
    examples:
      - text: "I still haven't decided which university to go to, but I've {{narrowed it down}} to about four."

  - id: plug-in-phrasal_verb
    headword: "plug in"
    pos: phrasal_verb
    cefr: B2
    tags: [science, technology, phrasal_verb]
    senses:
      - definition_en: "connect to the electricity supply"
        definition_vi: "cắm điện"
    examples:
      - text: "The television isn't working because you haven't {{plugged it in}}!"

  - id: put-through-phrasal_verb
    headword: "put through"
    pos: phrasal_verb
    cefr: B2
    tags: [science, technology, phrasal_verb]
    senses:
      - definition_en: "connect by phone"
        definition_vi: "nối máy"
    examples:
      - text: "I'll just {{put you through}} to the supervisor, caller."

  - id: turn-into-phrasal_verb
    headword: "turn into"
    pos: phrasal_verb
    cefr: B2
    tags: [science, technology, phrasal_verb]
    senses:
      - definition_en: "change into sth different"
        definition_vi: "biến thành"
    examples:
      - text: "It started as the holiday of a lifetime but soon {{turned into}} a nightmare."

  - id: turn-off-phrasal_verb
    headword: "turn off"
    pos: phrasal_verb
    cefr: B2
    tags: [science, technology, phrasal_verb]
    senses:
      - definition_en: "stop a machine working"
        definition_vi: "tắt"
    examples:
      - text: "Would you please {{turn off}} that music?"

  - id: work-out-phrasal_verb
    headword: "work out"
    pos: phrasal_verb
    cefr: B2
    tags: [science, technology, phrasal_verb]
    senses:
      - definition_en: "find the solution to a problem, etc"
        definition_vi: "tìm ra cách giải quyết"
    examples:
      - text: "We need to {{work out}} how we're going to get there."

  - id: make-an-attempt-phrase
    headword: "make an attempt"
    pos: phrase
    cefr: B2
    tags: [science, technology, phrase]
    senses:
      - definition_en: "to try to do something"
        definition_vi: "thử làm gì"
    examples:
      - text: "He {{made no attempt}} to apologise."

  - id: attempt-to-do-phrase
    headword: "attempt to do"
    pos: phrase
    cefr: B2
    tags: [science, technology, phrase]
    senses:
      - definition_en: "to try to do something"
        definition_vi: "cố gắng làm gì"
    examples:
      - text: "He {{attempted to escape}} through a window."

  - id: in-an-attempt-to-phrase
    headword: "in an attempt to"
    pos: phrase
    cefr: B2
    tags: [science, technology, phrase]
    senses:
      - definition_en: "with the purpose of trying to do something"
        definition_vi: "với nỗ lực làm gì"
    examples:
      - text: "They closed the road {{in an attempt to}} reduce traffic."

  - id: on-average-phrase
    headword: "on average"
    pos: phrase
    cefr: B2
    tags: [science, technology, phrase]
    senses:
      - definition_en: "usually, typically"
        definition_vi: "trung bình"
    examples:
      - text: "{{On average}}, people spend 10 hours a day looking at screens."

  - id: in-the-beginning-phrase
    headword: "in the beginning"
    pos: phrase
    cefr: B2
    tags: [science, technology, phrase]
    senses:
      - definition_en: "at first"
        definition_vi: "lúc đầu"
    examples:
      - text: "{{In the beginning}}, nobody understood what was happening."

  - id: at-the-beginning-of-phrase
    headword: "at the beginning of"
    pos: phrase
    cefr: B2
    tags: [science, technology, phrase]
    senses:
      - definition_en: "the start of something"
        definition_vi: "ở phần đầu của"
    examples:
      - text: "I pay my rent {{at the beginning of}} the month."

  - id: beginning-with-phrase
    headword: "beginning with"
    pos: phrase
    cefr: B2
    tags: [science, technology, phrase]
    senses:
      - definition_en: "starting with"
        definition_vi: "bắt đầu với"
    examples:
      - text: "We are reading a book {{beginning with}} a poem."

  - id: at-the-bottom-phrase
    headword: "at the bottom"
    pos: phrase
    cefr: B2
    tags: [science, technology, phrase]
    senses:
      - definition_en: "the lowest part of something"
        definition_vi: "ở dưới đáy"
    examples:
      - text: "The answers are {{at the bottom}} of the page."

  - id: on-the-bottom-phrase
    headword: "on the bottom"
    pos: phrase
    cefr: B2
    tags: [science, technology, phrase]
    senses:
      - definition_en: "placed on the lowest surface"
        definition_vi: "trên đáy"
    examples:
      - text: "There was a lot of mud {{on the bottom}} of the lake."

  - id: be-the-cause-of-phrase
    headword: "be the cause of"
    pos: phrase
    cefr: B2
    tags: [science, technology, phrase]
    senses:
      - definition_en: "to be the reason something happens"
        definition_vi: "là nguyên nhân của"
    examples:
      - text: "The bad weather {{was the cause of}} the delay."

  - id: find-the-cause-of-phrase
    headword: "find the cause of"
    pos: phrase
    cefr: B2
    tags: [science, technology, phrase]
    senses:
      - definition_en: "to discover the reason for something"
        definition_vi: "tìm ra nguyên nhân của"
    examples:
      - text: "Scientists are still trying to {{find the cause of}} the disease."

  - id: look-for-the-cause-of-phrase
    headword: "look for the cause of"
    pos: phrase
    cefr: B2
    tags: [science, technology, phrase]
    senses:
      - definition_en: "to search for the reason for something"
        definition_vi: "tìm kiếm nguyên nhân của"
    examples:
      - text: "We need to {{look for the cause of}} this issue."

  - id: come-to-a-conclusion-phrase
    headword: "come to a conclusion"
    pos: phrase
    cefr: B2
    tags: [science, technology, phrase]
    senses:
      - definition_en: "to decide what is true after considering the facts"
        definition_vi: "đi đến kết luận"
    examples:
      - text: "I've {{come to the conclusion}} that he's not the right person for the job."

  - id: reach-a-conclusion-phrase
    headword: "reach a conclusion"
    pos: phrase
    cefr: B2
    tags: [science, technology, phrase]
    senses:
      - definition_en: "to make a decision after considering information"
        definition_vi: "đạt được kết luận"
    examples:
      - text: "The jury {{reached a conclusion}} after hours of debate."

  - id: in-conclusion-phrase
    headword: "in conclusion"
    pos: phrase
    cefr: B2
    tags: [science, technology, phrase]
    senses:
      - definition_en: "finally, to sum up"
        definition_vi: "tóm lại"
    examples:
      - text: "{{In conclusion}}, I would like to thank you all for coming."

  - id: do-an-experiment-phrase
    headword: "do an experiment"
    pos: phrase
    cefr: B2
    tags: [science, technology, phrase]
    senses:
      - definition_en: "to perform a scientific test"
        definition_vi: "làm thí nghiệm"
    examples:
      - text: "We will {{do an experiment}} in chemistry class tomorrow."

  - id: perform-an-experiment-phrase
    headword: "perform an experiment"
    pos: phrase
    cefr: B2
    tags: [science, technology, phrase]
    senses:
      - definition_en: "to carry out a scientific test"
        definition_vi: "thực hiện thí nghiệm"
    examples:
      - text: "Researchers {{performed an experiment}} on the mice."

  - id: carry-out-an-experiment-phrase
    headword: "carry out an experiment"
    pos: phrase
    cefr: B2
    tags: [science, technology, phrase]
    senses:
      - definition_en: "to conduct a scientific test"
        definition_vi: "tiến hành thí nghiệm"
    examples:
      - text: "They {{carried out an experiment}} to test the new drug."

  - id: experiment-with-phrase
    headword: "experiment with"
    pos: phrase
    cefr: B2
    tags: [science, technology, phrase]
    senses:
      - definition_en: "to try something to see what result it has"
        definition_vi: "thử nghiệm với"
    examples:
      - text: "Some people {{experiment with}} different diets to lose weight."

  - id: in-fact-phrase
    headword: "in fact"
    pos: phrase
    cefr: B2
    tags: [science, technology, phrase]
    senses:
      - definition_en: "used to emphasize the truth of a statement"
        definition_vi: "thực tế là"
    examples:
      - text: "He was angry. {{In fact}}, he was absolutely furious."

  - id: as-a-matter-of-fact-phrase
    headword: "as a matter of fact"
    pos: phrase
    cefr: B2
    tags: [science, technology, phrase]
    senses:
      - definition_en: "actually, in reality"
        definition_vi: "thực ra"
    examples:
      - text: "I know the man well. {{As a matter of fact}}, I had dinner with him last week."

  - id: the-fact-is-phrase
    headword: "the fact is"
    pos: phrase
    cefr: B2
    tags: [science, technology, phrase]
    senses:
      - definition_en: "used to draw attention to the most important point"
        definition_vi: "sự thật là"
    examples:
      - text: "{{The fact is}} that we are running out of time."

  - id: face-the-facts-phrase
    headword: "face the facts"
