book: destination-b2
book_title: Destination B2 Grammar and Vocabulary
unit:
  ordinal: 4
  code: U04
  title: "Hobbies, sport and games"
  summary_md: "Comprehensive vocabulary unit covering sports, games, hobbies, phrasal verbs, collocations, word patterns, and word formation."
lesson:
  ordinal: 1
  kind: vocabulary
  title: "Hobbies, sport and games Vocabulary"
  slug: hobbies-sport-and-games
entries:
  # ==========================================
  # TOPIC VOCABULARY IN CONTRAST
  # ==========================================
  - id: pitch-noun
    headword: pitch
    pos: noun
    cefr: B2
    tags: [sport, place]
    senses:
      - definition_en: an area of ground specially prepared and marked for playing a sports game
        definition_vi: sân cỏ đã kẻ vạch (bóng đá, bóng bầu dục)
    examples:
      - text: "Fans invaded the {{pitch}} after the game."

  - id: track-noun
    headword: track
    pos: noun
    cefr: B2
    tags: [sport, place]
    senses:
      - definition_en: a piece of ground used for running or racing
        definition_vi: đường chạy điền kinh, đường đua
    examples:
      - text: "The runners are making their way around the {{track}}."

  - id: court-noun
    headword: court
    pos: noun
    cefr: B1
    tags: [sport, place]
    senses:
      - definition_en: an area drawn out on the ground used for playing sports such as tennis and basketball
        definition_vi: sân chơi có kẻ vạch (tennis, bóng rổ, cầu lông)
    examples:
      - text: "He won the match on the tennis {{court}}."

  - id: course-noun
    headword: course
    pos: noun
    cefr: B1
    tags: [sport, place]
    senses:
      - definition_en: a large area of land designed for playing golf on
        definition_vi: sân gôn
    examples:
      - text: "He set a new {{course}} record at the tournament."

  - id: ring-noun
    headword: ring
    pos: noun
    cefr: B2
    tags: [sport, place]
    senses:
      - definition_en: a raised area surrounded by ropes where people take part in boxing or wrestling
        definition_vi: võ đài, sới vật
    examples:
      - text: "The boxer was knocked down in the center of the {{ring}}."

  - id: rink-noun
    headword: rink
    pos: noun
    cefr: B2
    tags: [sport, place]
    senses:
      - definition_en: a large, flat surface, of ice or other hard material, for skating
        definition_vi: sân trượt băng, sân trượt patin
    examples:
      - text: "He skated a figure of eight in the ice {{rink}}."

  - id: win-verb
    headword: win
    pos: verb
    cefr: A2
    tags: [sport, competition]
    senses:
      - definition_en: to achieve first position and/or get a prize in a competition
        definition_vi: chiến thắng, giành phần thắng (giải thưởng, cuộc thi)
    examples:
      - text: "Which team do you think will {{win}} the match?"

  - id: beat-verb
    headword: beat
    pos: verb
    cefr: B1
    tags: [sport, competition]
    senses:
      - definition_en: to defeat or do better than someone
        definition_vi: đánh bại (ai đó)
    examples:
      - text: "Simon always {{beats}} me at tennis."

  - id: score-verb
    headword: score
    pos: verb
    cefr: A2
    tags: [sport, competition]
    senses:
      - definition_en: to win or get a point, goal, etc. in a competition or sport
        definition_vi: ghi bàn, ghi điểm
    examples:
      - text: "He has {{scored}} 12 goals so far this season."

  - id: play-noun
    headword: play
    pos: noun
    cefr: A2
    tags: [entertainment, theatre]
    senses:
      - definition_en: a piece of writing intended to be acted in a theatre
        definition_vi: vở kịch
    examples:
      - text: "She wrote a {{play}} for the students to perform."

  - id: game-noun
    headword: game
    pos: noun
    cefr: A1
    tags: [entertainment, sport]
    senses:
      - definition_en: an entertaining activity or sport played according to rules
        definition_vi: trò chơi, ván đấu, trận đấu
    examples:
      - text: "We played a {{game}} of chess."

  - id: spectator-noun
    headword: spectator
    pos: noun
    cefr: B1
    tags: [people, sport]
    senses:
      - definition_en: a person who watches an activity, especially a sports event, without taking part
        definition_vi: khán giả (xem trực tiếp tại sân vận động)
    examples:
      - text: "There were over 40,000 cheering {{spectators}}."

  - id: viewer-noun
    headword: viewer
    pos: noun
    cefr: B1
    tags: [people, media]
    senses:
      - definition_en: a person who watches something, especially television
        definition_vi: người xem (qua truyền hình)
    examples:
      - text: "Millions of {{viewers}} watched the final."

  - id: umpire-noun
    headword: umpire
    pos: noun
    cefr: B2
    tags: [people, sport]
    senses:
      - definition_en: a person who enforces the rules in sports like tennis or baseball
        definition_vi: trọng tài (trong các môn như tennis, bóng chày)
    examples:
      - text: "The {{umpire}} called the ball out."

  - id: referee-noun
    headword: referee
    pos: noun
    cefr: B2
    tags: [people, sport]
    senses:
      - definition_en: a person who is in charge of a sports game like football or boxing
        definition_vi: trọng tài (trong bóng đá, quyền anh)
    examples:
      - text: "The {{referee}} blew his whistle."

  - id: final-noun
    headword: final
    pos: noun
    cefr: A2
    tags: [sport, event]
    senses:
      - definition_en: the last in a series of games or competitions
        definition_vi: trận chung kết
    examples:
      - text: "We reached the tennis {{final}}."

  - id: finale-noun
    headword: finale
    pos: noun
    cefr: B2
    tags: [entertainment, event]
    senses:
      - definition_en: the last part of a performance, usually exciting
        definition_vi: hồi kết, màn bế mạc (âm nhạc, nghệ thuật)
    examples:
      - text: "The festival ended with a spectacular {{finale}}."

  - id: end-noun
    headword: end
    pos: noun
    cefr: A1
    tags: [time, event]
    senses:
      - definition_en: the time when a situation or an event stops
        definition_vi: sự kết thúc, thời điểm kết thúc
    examples:
      - text: "I stayed until the {{end}} of the game."

  - id: ending-noun
    headword: ending
    pos: noun
    cefr: A2
    tags: [entertainment, literature]
    senses:
      - definition_en: the last part of a story or film
        definition_vi: cái kết, phần cuối (của bộ phim, câu chuyện)
    examples:
      - text: "I prefer movies with a happy {{ending}}."

  - id: bat-noun
    headword: bat
    pos: noun
    cefr: B1
    tags: [sport, equipment]
    senses:
      - definition_en: a wooden object used for hitting the ball in baseball, cricket, or table tennis
        definition_vi: gậy đánh bóng (bóng chày, bóng bàn, cricket)
    examples:
      - text: "He swung the baseball {{bat}}."

  - id: stick-noun
    headword: stick
    pos: noun
    cefr: A2
    tags: [sport, equipment]
    senses:
      - definition_en: a long thin piece of wood used in playing hockey
        definition_vi: gậy (khúc côn cầu)
    examples:
      - text: "You need a hockey {{stick}}."

  - id: rod-noun
    headword: rod
    pos: noun
    cefr: B1
    tags: [sport, equipment]
    senses:
      - definition_en: a long thin pole used for fishing
        definition_vi: cần câu
    examples:
      - text: "We sat by the river with our fishing {{rods}}."

  - id: racket-noun
    headword: racket
    pos: noun
    cefr: A2
    tags: [sport, equipment]
    senses:
      - definition_en: an object used for hitting the ball in tennis or badminton
        definition_vi: cây vợt (tennis, cầu lông)
    examples:
      - text: "I bought a new tennis {{racket}}."

  - id: amateur-adjective
    headword: amateur
    pos: adjective
    cefr: B2
    tags: [sport, status]
    senses:
      - definition_en: taking part in an activity for pleasure, not as a job
        definition_vi: nghiệp dư (không chuyên)
    examples:
      - text: "He was an {{amateur}} photographer."

  - id: professional-adjective
    headword: professional
    pos: adjective
    cefr: B1
    tags: [sport, status]
    senses:
      - definition_en: playing a sport or doing an activity for money
        definition_vi: chuyên nghiệp
    examples:
      - text: "She is a {{professional}} tennis player."

  - id: sport-noun
    headword: sport
    pos: noun
    cefr: A1
    tags: [sport, generic]
    senses:
      - definition_en: a game or activity needing physical effort and skill
        definition_vi: thể thao (nói chung)
    examples:
      - text: "Football is a popular {{sport}}."

  - id: athletics-noun
    headword: athletics
    pos: noun
    cefr: B1
    tags: [sport, activity]
    senses:
      - definition_en: sports including running, jumping, and throwing
        definition_vi: môn điền kinh
    examples:
      - text: "She loves watching {{athletics}}."

  - id: interval-noun
    headword: interval
    pos: noun
    cefr: B2
    tags: [time, event]
    senses:
      - definition_en: a short period between the parts of a performance or a play
        definition_vi: giờ giải lao (trong rạp hát, buổi hòa nhạc)
    examples:
      - text: "There is a 20-minute {{interval}} after the first act."

  - id: half-time-noun
    headword: half time
    pos: noun
    cefr: B1
    tags: [time, sport]
    senses:
      - definition_en: a short rest period between the two parts of a sports game
        definition_vi: giờ nghỉ giữa hiệp (thể thao)
    examples:
      - text: "The manager gave a speech at {{half time}}."

  - id: draw-noun
    headword: draw
    pos: noun
    cefr: B2
    tags: [sport, result]
    senses:
      - definition_en: a situation in which each team in a game has equal points
        definition_vi: trận hòa
    examples:
      - text: "The match ended in a {{draw}}."

  - id: equal-verb
    headword: equal
    pos: verb
    cefr: B1
    tags: [sport, result]
    senses:
      - definition_en: to achieve the same standard, level, or amount as someone or something else
        definition_vi: bằng, san bằng (tỉ số, kỷ lục)
    examples:
      - text: "He {{equalled}} the world record."

  - id: competitor-noun
    headword: competitor
    pos: noun
    cefr: B1
    tags: [people, competition]
    senses:
      - definition_en: a person or team competing against others
        definition_vi: người thi đấu
    examples:
      - text: "There were 500 {{competitors}} in the marathon."

  - id: opponent-noun
    headword: opponent
    pos: noun
    cefr: B2
    tags: [people, competition]
    senses:
      - definition_en: a person who someone is competing against in a sports event or game
        definition_vi: đối thủ (trực tiếp đối đầu)
    examples:
      - text: "He beat his {{opponent}} easily."

  # ==========================================
  # PHRASAL VERBS
  # ==========================================
  - id: bring-forward-phrasal
    headword: bring forward
    pos: verb
    cefr: B2
    tags: [time, phrasal_verb]
    senses:
      - definition_en: to change the date/time of an event so it happens earlier
        definition_vi: dời lên sớm hơn
    examples:
      - text: "The meeting has been {{brought forward}} to Monday."

  - id: carry-on-phrasal
    headword: carry on
    pos: verb
    cefr: B1
    tags: [action, phrasal_verb]
    senses:
      - definition_en: to continue
        definition_vi: tiếp tục
    examples:
      - text: "Please {{carry on}} with your work."

  - id: get-round-to-phrasal
    headword: get round to
    pos: verb
    cefr: B2
    tags: [action, phrasal_verb]
    senses:
      - definition_en: to start doing something that you have planned to do for a long time
        definition_vi: rốt cuộc cũng có thời gian để bắt tay vào làm việc gì
    examples:
      - text: "I finally {{got round to}} reading that book."

  - id: get-up-to-phrasal
    headword: get up to
    pos: verb
    cefr: B2
    tags: [action, phrasal_verb]
    senses:
      - definition_en: to do something you should not do
        definition_vi: giở trò, làm chuyện gì đó (sai trái, mờ ám)
    examples:
      - text: "What did the kids {{get up to}} while I was out?"

  - id: go-in-for-phrasal
    headword: go in for
    pos: verb
    cefr: B2
    tags: [competition, phrasal_verb]
    senses:
      - definition_en: to enter a competition, or to enjoy a particular thing
        definition_vi: tham gia (cuộc thi), có hứng thú/sở thích làm gì
    examples:
      - text: "I'm going to {{go in for}} the photography competition."

  - id: go-off-phrasal
    headword: go off
    pos: verb
    cefr: B2
    tags: [feelings, phrasal_verb]
    senses:
      - definition_en: to stop liking someone or something
        definition_vi: chán, không còn thích nữa
    examples:
      - text: "I've {{gone off}} coffee recently."

  - id: join-in-phrasal
    headword: join in
    pos: verb
    cefr: B1
    tags: [action, phrasal_verb]
    senses:
      - definition_en: to participate, to become involved in an activity
        definition_vi: tham gia vào
    examples:
      - text: "Feel free to {{join in}} the game."

  - id: knock-out-phrasal
    headword: knock out
    pos: verb
    cefr: B2
    tags: [sport, phrasal_verb]
    senses:
      - definition_en: to defeat a person or team so they can no longer take part
        definition_vi: loại (khỏi cuộc thi), đánh nốc ao
    examples:
      - text: "Our team was {{knocked out}} in the semi-finals."

  - id: look-out-phrasal
    headword: look out
    pos: verb
    cefr: B1
    tags: [warning, phrasal_verb]
    senses:
      - definition_en: be careful
        definition_vi: cẩn thận, coi chừng
    examples:
      - text: "{{Look out}}! There's a car coming."

  - id: pull-out-phrasal
    headword: pull out
    pos: verb
    cefr: B2
    tags: [action, phrasal_verb]
    senses:
      - definition_en: to stop being involved in an activity
        definition_vi: rút lui khỏi
    examples:
      - text: "He had to {{pull out}} of the race due to injury."

  - id: put-off-phrasal
    headword: put off
    pos: verb
    cefr: B1
    tags: [time, phrasal_verb]
    senses:
      - definition_en: to delay an event
        definition_vi: trì hoãn
    examples:
      - text: "Never {{put off}} until tomorrow what you can do today."

  - id: put-up-with-phrasal
    headword: put up with
    pos: verb
    cefr: B2
    tags: [feelings, phrasal_verb]
    senses:
      - definition_en: to tolerate
        definition_vi: chịu đựng
    examples:
      - text: "I can't {{put up with}} this noise any longer."

  - id: take-to-phrasal
    headword: take to
    pos: verb
    cefr: B2
    tags: [habit, phrasal_verb]
    senses:
      - definition_en: to start doing something as a habit
        definition_vi: bắt đầu có thói quen làm gì
    examples:
      - text: "He's {{taken to}} staying up very late."

  - id: take-up-phrasal
    headword: take up
    pos: verb
    cefr: B1
    tags: [hobby, phrasal_verb]
    senses:
      - definition_en: to start a new hobby, sport, or job
        definition_vi: bắt đầu một sở thích, thể thao
    examples:
      - text: "I decided to {{take up}} tennis."

  # ==========================================
  # PHRASES AND COLLOCATIONS
  # ==========================================
  - id: make-the-best-of-phrase
    headword: make the best of sth
    pos: phrase
    cefr: B2
    tags: [collocation, best]
    senses:
      - definition_en: to deal with a bad situation as well as you can
        definition_vi: tận dụng tốt nhất một tình huống xấu
    examples:
      - text: "It's raining, but we'll {{make the best of it}}."

  - id: do-your-best-phrase
    headword: do your best
    pos: phrase
    cefr: B1
    tags: [collocation, best]
    senses:
      - definition_en: to try as hard as you can
        definition_vi: cố gắng hết sức
    examples:
      - text: "Just {{do your best}} in the exam."

  - id: the-best-at-phrase
    headword: the best at sth/doing
    pos: phrase
    cefr: A2
    tags: [collocation, best]
    senses:
      - definition_en: being more skilled than anyone else at something
        definition_vi: giỏi nhất ở việc gì
    examples:
      - text: "She is {{the best at playing}} chess in our school."

  - id: have-a-chance-to-do-phrase
    headword: have/take/get a chance to do
    pos: phrase
    cefr: A2
    tags: [collocation, chance]
    senses:
      - definition_en: to have the opportunity to do something
        definition_vi: có/chớp lấy cơ hội để làm gì
    examples:
      - text: "I didn't {{get a chance to speak}} to him."

  - id: have-a-chance-of-doing-phrase
    headword: have a chance of doing
    pos: phrase
    cefr: B1
    tags: [collocation, chance]
    senses:
      - definition_en: to have the possibility of achieving something
        definition_vi: có khả năng/cơ hội làm gì
    examples:
      - text: "Do we {{have a chance of winning}}?"

  - id: some-chance-of-doing-phrase
    headword: some/little/etc chance of (your) doing
    pos: phrase
    cefr: B2
    tags: [collocation, chance]
    senses:
      - definition_en: referring to the degree of probability of something happening
        definition_vi: có chút/có ít cơ hội/khả năng xảy ra việc gì
    examples:
      - text: "There is {{little chance of him passing}} the test."

  - id: the-chances-of-doing-phrase
    headword: the chances of (your) doing
    pos: phrase
    cefr: B2
    tags: [collocation, chance]
    senses:
      - definition_en: the likelihood that something will happen
        definition_vi: khả năng xảy ra của việc gì
    examples:
      - text: "What are {{the chances of you coming}} early?"

  - id: take-a-chance-on-phrase
    headword: take a chance (on sth)
    pos: phrase
    cefr: B2
    tags: [collocation, chance]
    senses:
      - definition_en: to do something that involves risks
        definition_vi: đánh liều, thử vận may (với cái gì)
    examples:
      - text: "Let's {{take a chance on}} the weather and go to the beach."

  - id: chance-of-a-lifetime-phrase
    headword: chance of a lifetime
    pos: phrase
    cefr: B2
    tags: [collocation, chance]
    senses:
      - definition_en: a great and rare opportunity
        definition_vi: cơ hội ngàn năm có một
    examples:
      - text: "This trip is the {{chance of a lifetime}}."

  - id: your-go-phrase
    headword: your go
    pos: phrase
    cefr: A2
    tags: [collocation, go]
    senses:
      - definition_en: someone's turn to do something (in a game)
        definition_vi: lượt của bạn
    examples:
      - text: "Roll the dice, it's {{your go}}."

  - id: have-a-go-phrase
    headword: have a go
    pos: phrase
    cefr: B1
    tags: [collocation, go]
    senses:
      - definition_en: to try to do something
        definition_vi: thử làm việc gì
    examples:
      - text: "I'd like to {{have a go}} at surfing."

  - id: in-height-phrase
    headword: in height
    pos: phrase
    cefr: B1
    tags: [collocation, height]
    senses:
      - definition_en: referring to how tall something is
        definition_vi: có chiều cao là (đơn vị đo lường)
    examples:
      - text: "The tree is three meters {{in height}}."

  - id: afraid-of-heights-phrase
    headword: afraid of heights
    pos: phrase
    cefr: B1
    tags: [collocation, height]
    senses:
      - definition_en: having a phobia of high places
        definition_vi: sợ độ cao
    examples:
      - text: "I can't climb up there, I'm {{afraid of heights}}."

  - id: height-of-sth-phrase
    headword: height of sth
    pos: phrase
    cefr: B2
    tags: [collocation, height]
    senses:
      - definition_en: the extreme or highest point of something
        definition_vi: đỉnh điểm của cái gì (sự nghiệp, mùa hè...)
    examples:
      - text: "He is at the {{height of his career}}."

  - id: mad-about-phrase
    headword: mad about/on sth/sb/doing
    pos: phrase
    cefr: B1
    tags: [collocation, mad]
    senses:
      - definition_en: to like someone or something very much
        definition_vi: cực kỳ thích, phát cuồng vì
    examples:
      - text: "My brother is {{mad about football}}."

  - id: go-mad-phrase
    headword: go/become mad
    pos: phrase
    cefr: B2
    tags: [collocation, mad]
    senses:
      - definition_en: to become very angry or mentally ill
        definition_vi: trở nên phát điên, tức điên
    examples:
      - text: "She'll {{go mad}} when she finds out."

  - id: take-pleasure-in-phrase
    headword: take pleasure in sth/doing
    pos: phrase
    cefr: B2
    tags: [collocation, pleasure]
    senses:
      - definition_en: to find something enjoyable
        definition_vi: tìm thấy niềm vui trong việc gì
    examples:
      - text: "He {{takes pleasure in helping}} others."

  - id: gain-pleasure-from-phrase
    headword: gain/get pleasure from sth/doing
    pos: phrase
    cefr: B2
    tags: [collocation, pleasure]
    senses:
      - definition_en: to derive happiness from something
        definition_vi: có được niềm vui từ việc gì
    examples:
      - text: "I {{get a lot of pleasure from reading}}."

  - id: popular-with-phrase
    headword: popular with/among
    pos: phrase
    cefr: B1
    tags: [collocation, popular]
    senses:
      - definition_en: liked by a particular group of people
        definition_vi: được yêu thích/phổ biến trong giới (ai đó)
    examples:
      - text: "The teacher is very {{popular with}} his students."

  - id: opposite-side-phrase
    headword: (on) the opposite side
    pos: phrase
    cefr: B1
    tags: [collocation, side]
    senses:
      - definition_en: facing something or someone else
        definition_vi: (ở) phía đối diện
    examples:
      - text: "They live on the {{opposite side}} of the street."

  - id: far-side-phrase
    headword: (on) the far side
    pos: phrase
    cefr: B2
    tags: [collocation, side]
    senses:
