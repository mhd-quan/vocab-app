book: destination-b2
book_title: Destination B2 Grammar and Vocabulary
unit:
  ordinal: 8
  code: U08
  title: The Media
  summary_md: |
    Toàn bộ từ vựng Unit 8: The Media.
    Bao gồm Topic vocabulary in contrast, Phrasal verbs, Phrases and collocations, Word patterns và Word formation.

lesson:
  ordinal: 1
  kind: vocabulary
  title: The Media Vocabulary
  slug: unit-8-the-media

entries:

  - id: deny-verb
    headword: "deny"
    pos: verb
    cefr: B2
    tags: [topic-vocabulary, contrast]
    senses:
      - definition_en: "to say that something is not true"
        definition_vi: "phủ nhận"
    examples:
      - text: "He completely {{deny|denied}} the accusation."

  - id: refuse-verb
    headword: "refuse"
    pos: verb
    cefr: B2
    tags: [topic-vocabulary, contrast]
    senses:
      - definition_en: "to say that you will not do or accept something"
        definition_vi: "từ chối"
    examples:
      - text: "She {{refuse|refused}} to answer any questions."

  - id: agree-verb
    headword: "agree"
    pos: verb
    cefr: A2
    tags: [topic-vocabulary, contrast]
    senses:
      - definition_en: "to have the same opinion as someone else"
        definition_vi: "đồng ý"
    examples:
      - text: "I totally {{agree}} with your point of view."

  - id: accept-verb
    headword: "accept"
    pos: verb
    cefr: B1
    tags: [topic-vocabulary, contrast]
    senses:
      - definition_en: "to recognize that something is true, fair, or right"
        definition_vi: "chấp nhận"
    examples:
      - text: "He couldn't {{accept}} the fact that he lost."

  - id: headline-noun
    headword: "headline"
    pos: noun
    cefr: B1
    tags: [topic-vocabulary, contrast]
    senses:
      - definition_en: "the title of a newspaper story, printed in large letters"
        definition_vi: "tiêu đề bài báo"
    examples:
      - text: "The scandal was on the front page {{headline}}."

  - id: heading-noun
    headword: "heading"
    pos: noun
    cefr: B1
    tags: [topic-vocabulary, contrast]
    senses:
      - definition_en: "a title at the top of a page or piece of writing"
        definition_vi: "tiêu đề (của đoạn/trang)"
    examples:
      - text: "Look at the {{heading}} of this chapter."

  - id: feature-noun
    headword: "feature"
    pos: noun
    cefr: B2
    tags: [topic-vocabulary, contrast]
    senses:
      - definition_en: "a special article in a newspaper or magazine, or a part of a television or radio broadcast"
        definition_vi: "bài đặc biệt, chuyên mục"
    examples:
      - text: "The magazine ran a long {{feature}} on climate change."

  - id: article-noun
    headword: "article"
    pos: noun
    cefr: A2
    tags: [topic-vocabulary, contrast]
    senses:
      - definition_en: "a piece of writing in a newspaper or magazine"
        definition_vi: "bài báo"
    examples:
      - text: "I read an interesting {{article}} about space exploration."

  - id: talk-show-noun
    headword: "talk show"
    pos: noun
    cefr: A2
    tags: [topic-vocabulary, contrast]
    senses:
      - definition_en: "a television or radio programme in which famous people talk about themselves and their work"
        definition_vi: "chương trình trò chuyện"
    examples:
      - text: "The actor was invited to a popular late-night {{talk show}}."

  - id: quiz-show-noun
    headword: "quiz show"
    pos: noun
    cefr: A2
    tags: [topic-vocabulary, contrast]
    senses:
      - definition_en: "a television or radio programme in which people answer questions in order to win prizes"
        definition_vi: "chương trình đố vui"
    examples:
      - text: "She won a car on a TV {{quiz show}}."

  - id: game-show-noun
    headword: "game show"
    pos: noun
    cefr: A2
    tags: [topic-vocabulary, contrast]
    senses:
      - definition_en: "a television or radio programme in which people play games or answer questions in order to win prizes"
        definition_vi: "trò chơi truyền hình"
    examples:
      - text: "He was a contestant on a famous {{game show}}."

  - id: announcer-noun
    headword: "announcer"
    pos: noun
    cefr: B2
    tags: [topic-vocabulary, contrast]
    senses:
      - definition_en: "someone whose job is to give information about television or radio programmes between other programmes"
        definition_vi: "người giới thiệu chương trình"
    examples:
      - text: "The television {{announcer}} introduced the next film."

  - id: commentator-noun
    headword: "commentator"
    pos: noun
    cefr: B2
    tags: [topic-vocabulary, contrast]
    senses:
      - definition_en: "someone whose job is to give a description of an event on television or radio as it happens"
        definition_vi: "bình luận viên"
    examples:
      - text: "The sports {{commentator}} got very excited during the match."

  - id: tabloid-noun
    headword: "tabloid"
    pos: noun
    cefr: B2
    tags: [topic-vocabulary, contrast]
    senses:
      - definition_en: "a type of popular newspaper with small pages and many pictures"
        definition_vi: "báo lá cải, báo khổ nhỏ"
    examples:
      - text: "The {{tabloid}} press is full of gossip about celebrities."

  - id: broadsheet-noun
    headword: "broadsheet"
    pos: noun
    cefr: B2
    tags: [topic-vocabulary, contrast]
    senses:
      - definition_en: "a serious type of newspaper that is printed on large sheets of paper"
        definition_vi: "báo khổ lớn, báo chính thống"
    examples:
      - text: "He prefers reading a {{broadsheet}} for in-depth news analysis."

  - id: journalist-word-formation-noun
    headword: "journalist"
    pos: noun
    cefr: B1
    tags: [topic-vocabulary, contrast]
    senses:
      - definition_en: "someone whose job is to report the news for a newspaper, magazine, radio programme, or television programme"
        definition_vi: "nhà báo"
    examples:
      - text: "The {{journalist}} was praised for her investigative reporting."

  - id: columnist-noun
    headword: "columnist"
    pos: noun
    cefr: B2
    tags: [topic-vocabulary, contrast]
    senses:
      - definition_en: "a journalist who writes a regular series of articles for a particular newspaper or magazine"
        definition_vi: "người phụ trách chuyên mục"
    examples:
      - text: "He is a regular sports {{columnist}} for a national daily."

  - id: press-noun
    headword: "press"
    pos: noun
    cefr: B1
    tags: [topic-vocabulary, contrast]
    senses:
      - definition_en: "newspapers and news magazines, or the journalists who work on them"
        definition_vi: "báo chí"
    examples:
      - text: "The local {{press}} covered the event extensively."

  - id: media-noun
    headword: "media"
    pos: noun
    cefr: B1
    tags: [topic-vocabulary, contrast]
    senses:
      - definition_en: "radio, television, newspapers, the Internet, and magazines, considered as a group"
        definition_vi: "truyền thông"
    examples:
      - text: "The mass {{media}} plays a huge role in shaping public opinion."

  - id: programme-noun
    headword: "programme"
    pos: noun
    cefr: A2
    tags: [topic-vocabulary, contrast]
    senses:
      - definition_en: "a television or radio broadcast"
        definition_vi: "chương trình (truyền hình/phát thanh)"
    examples:
      - text: "What is your favourite TV {{programme}}?"

  - id: program-noun
    headword: "program"
    pos: noun
    cefr: A2
    tags: [topic-vocabulary, contrast]
    senses:
      - definition_en: "a series of instructions that makes a computer do something"
        definition_vi: "chương trình máy tính"
    examples:
      - text: "He wrote a computer {{program}} to solve the problem."

  - id: channel-noun
    headword: "channel"
    pos: noun
    cefr: A2
    tags: [topic-vocabulary, contrast]
    senses:
      - definition_en: "a television station"
        definition_vi: "kênh truyền hình"
    examples:
      - text: "Can you switch the {{channel}} to the news?"

  - id: broadcast-noun
    headword: "broadcast"
    pos: noun
    cefr: B2
    tags: [topic-vocabulary, contrast]
    senses:
      - definition_en: "a television or radio programme"
        definition_vi: "chương trình phát sóng"
    examples:
      - text: "The live {{broadcast}} will begin at 8 PM."

  - id: bulletin-noun
    headword: "bulletin"
    pos: noun
    cefr: B2
    tags: [topic-vocabulary, contrast]
    senses:
      - definition_en: "a short news broadcast"
        definition_vi: "bản tin ngắn"
    examples:
      - text: "There is an hourly news {{bulletin}} on this station."

  - id: newsflash-noun
    headword: "newsflash"
    pos: noun
    cefr: B2
    tags: [topic-vocabulary, contrast]
    senses:
      - definition_en: "a short broadcast of an important piece of news in the middle of a television or radio programme"
        definition_vi: "tin khẩn, tin nóng"
    examples:
      - text: "We interrupt this programme to bring you a {{newsflash}}."

  - id: bring-up-verb
    headword: "bring up"
    pos: verb
    cefr: B2
    tags: [phrasal-verb]
    senses:
      - definition_en: "start discussing a subject"
        definition_vi: "đề cập tới, mang ra thảo luận"
    examples:
      - text: "Why did you have to {{bring up}} that topic during dinner?"

  - id: come-on-verb
    headword: "come on"
    pos: verb
    cefr: B2
    tags: [phrasal-verb]
    senses:
      - definition_en: "start to be broadcast"
        definition_vi: "bắt đầu phát sóng"
    examples:
      - text: "My favourite show will {{come on}} in ten minutes."

  - id: come-out-verb
    headword: "come out"
    pos: verb
    cefr: B1
    tags: [phrasal-verb]
    senses:
      - definition_en: "be published"
        definition_vi: "được xuất bản, phát hành"
    examples:
      - text: "When does her new book {{come out}}?"

  - id: fill-in-verb
    headword: "fill in"
    pos: verb
    cefr: A2
    tags: [phrasal-verb]
    senses:
      - definition_en: "add information in the empty spaces on an official document"
        definition_vi: "điền thông tin vào"
    examples:
      - text: "Please {{fill in}} this application form."

  - id: flick-through-verb
    headword: "flick through"
    pos: verb
    cefr: B2
    tags: [phrasal-verb]
    senses:
      - definition_en: "turn and look at the pages of a magazine, etc quickly"
        definition_vi: "lướt nhanh qua (sách, báo)"
    examples:
      - text: "I was just {{flick|flicking through}} a magazine while waiting."

  - id: go-into-verb
    headword: "go into"
    pos: verb
    cefr: B2
    tags: [phrasal-verb]
    senses:
      - definition_en: "deal with sth in detail"
        definition_vi: "đi sâu vào chi tiết"
    examples:
      - text: "We don't need to {{go into}} all the details now."

  - id: hand-out-verb
    headword: "hand out"
    pos: verb
    cefr: B1
    tags: [phrasal-verb]
    senses:
      - definition_en: "give things to people in a group"
        definition_vi: "phân phát"
    examples:
      - text: "Could you help me {{hand out}} these leaflets?"

  - id: look-up-verb
    headword: "look up"
    pos: verb
    cefr: A2
    tags: [phrasal-verb]
    senses:
      - definition_en: "try to find information in a book or list, etc"
        definition_vi: "tra cứu"
    examples:
      - text: "If you don't know the word, {{look}} it {{up}} in a dictionary."

  - id: make-out-verb
    headword: "make out"
    pos: verb
    cefr: B2
    tags: [phrasal-verb]
    senses:
      - definition_en: "pretend that something is true; see, hear or understand sb or sth with difficulty"
        definition_vi: "giả vờ; nhìn, nghe hoặc hiểu một cách khó khăn"
    examples:
      - text: "I could barely {{make out}} his handwriting."

  - id: make-up-verb
    headword: "make up"
    pos: verb
    cefr: B1
    tags: [phrasal-verb]
    senses:
      - definition_en: "invent an explanation, excuse, etc; create a story, poem, etc"
        definition_vi: "bịa ra, sáng tác"
    examples:
      - text: "He had to {{make up}} an excuse for being late."

  - id: put-forward-verb
    headword: "put forward"
    pos: verb
    cefr: B2
    tags: [phrasal-verb]
    senses:
      - definition_en: "suggest"
        definition_vi: "đề xuất"
    examples:
      - text: "She {{put forward}} a brilliant idea during the meeting."

  - id: see-through-verb
    headword: "see through"
    pos: verb
    cefr: B2
    tags: [phrasal-verb]
    senses:
      - definition_en: "recognise that sth is not true and not be tricked by it"
        definition_vi: "nhìn thấu (sự dối trá)"
    examples:
      - text: "I can easily {{see through}} his lies."

  - id: stand-out-verb
    headword: "stand out"
    pos: verb
    cefr: B2
    tags: [phrasal-verb]
    senses:
      - definition_en: "be easy to see because of being different"
        definition_vi: "nổi bật"
    examples:
      - text: "Her bright red dress made her {{stand out}} in the crowd."

  - id: turn-over-verb
    headword: "turn over"
    pos: verb
    cefr: B1
    tags: [phrasal-verb]
    senses:
      - definition_en: "turn a page so that the other side is towards you"
        definition_vi: "lật trang"
    examples:
      - text: "When you are ready, you may {{turn over}} the exam paper."

  - id: in-control-of-phrase
    headword: "in control of"
    pos: phrase
    cefr: B2
    tags: [collocation, control]
    senses:
      - definition_en: "having the power to direct something"
        definition_vi: "kiểm soát (chủ động)"
    examples:
      - text: "She is {{in control of}} the entire project."

  - id: take-control-of-phrase
    headword: "take control of"
    pos: phrase
    cefr: B2
    tags: [collocation, control]
    senses:
      - definition_en: "assume power or responsibility"
        definition_vi: "nắm quyền kiểm soát"
    examples:
      - text: "The rebels tried to {{take control of}} the radio station."

  - id: under-control-phrase
    headword: "under control"
    pos: phrase
    cefr: B1
    tags: [collocation, control]
    senses:
      - definition_en: "being dealt with successfully"
        definition_vi: "được kiểm soát"
    examples:
      - text: "Don't worry, everything is {{under control}}."

  - id: under-the-control-of-phrase
    headword: "under the control of"
    pos: phrase
    cefr: B2
    tags: [collocation, control]
    senses:
      - definition_en: "controlled by"
        definition_vi: "dưới sự kiểm soát của"
    examples:
      - text: "The territory is now {{under the control of}} the army."

  - id: out-of-control-phrase
    headword: "out of control"
    pos: phrase
    cefr: B2
    tags: [collocation, control]
    senses:
      - definition_en: "no longer possible to manage"
        definition_vi: "ngoài tầm kiểm soát"
    examples:
      - text: "The car spun {{out of control}} and crashed."

  - id: give-a-description-of-phrase
    headword: "give a description of"
    pos: phrase
    cefr: B1
    tags: [collocation, description]
    senses:
      - definition_en: "to describe something"
        definition_vi: "đưa ra sự mô tả về"
    examples:
      - text: "The witness had to {{give a description of}} the robber."

  - id: make-a-difference-to-phrase
    headword: "make a difference to"
    pos: phrase
    cefr: B1
    tags: [collocation, difference]
    senses:
      - definition_en: "have a significant effect on"
        definition_vi: "tạo ra sự khác biệt cho"
    examples:
      - text: "Exercise can {{make a difference to}} your health."

  - id: tell-the-difference-between-phrase
    headword: "tell the difference between"
    pos: phrase
    cefr: B1
    tags: [collocation, difference]
    senses:
      - definition_en: "distinguish"
        definition_vi: "phân biệt"
    examples:
      - text: "Can you {{tell the difference between}} these two twins?"

  - id: there-s-no-difference-between-phrase
    headword: "there's no difference between"
    pos: phrase
    cefr: B2
    tags: [collocation, difference]
    senses:
      - definition_en: "they are exactly the same"
        definition_vi: "không có sự khác biệt giữa"
    examples:
      - text: "In my eyes, {{there's no difference between}} the two options."

  - id: take-sth-for-granted-phrase
    headword: "take sth for granted"
    pos: phrase
    cefr: B2
    tags: [collocation, granted]
    senses:
      - definition_en: "fail to appreciate"
        definition_vi: "coi ai/cái gì là hiển nhiên"
    examples:
      - text: "He always {{take|takes}} his wife {{for granted}}."

  - id: influence-sth-verb
    headword: "influence sth"
    pos: verb
    cefr: B2
    tags: [collocation, influence]
    senses:
      - definition_en: "to affect or change how someone or something develops"
        definition_vi: "ảnh hưởng đến"
    examples:
      - text: "His early years heavily {{influence|influenced}} his later writing."

  - id: have-an-influence-on-phrase
    headword: "have an influence on"
    pos: phrase
    cefr: B2
    tags: [collocation, influence]
    senses:
      - definition_en: "affect someone or something"
        definition_vi: "có ảnh hưởng lên"
    examples:
      - text: "Television can {{have an influence on}} children's behaviour."

  - id: on-the-internet-phrase
    headword: "on the Internet"
    pos: phrase
    cefr: A2
    tags: [collocation, internet]
    senses:
      - definition_en: "using the internet"
        definition_vi: "trên mạng internet"
    examples:
      - text: "You can find a lot of information {{on the Internet}}."

  - id: over-the-internet-phrase
    headword: "over the Internet"
    pos: phrase
    cefr: B1
    tags: [collocation, internet]
    senses:
      - definition_en: "transmitted via the internet"
        definition_vi: "qua mạng internet"
    examples:
      - text: "We talked to our family {{over the Internet}}."

  - id: surf-the-internet-phrase
    headword: "surf the Internet"
    pos: phrase
    cefr: A2
    tags: [collocation, internet]
    senses:
      - definition_en: "browse the internet"
        definition_vi: "lướt web"
    examples:
      - text: "I spend too much time {{surf|surfing the Internet}}."

  - id: in-the-news-phrase
    headword: "in the news"
    pos: phrase
    cefr: B1
    tags: [collocation, news]
    senses:
      - definition_en: "being discussed on news programmes"
        definition_vi: "đang lên mặt báo"
    examples:
      - text: "The company has been {{in the news}} a lot recently."

  - id: on-the-news-phrase
    headword: "on the news"
    pos: phrase
    cefr: A2
    tags: [collocation, news]
    senses:
      - definition_en: "broadcast on a news programme"
        definition_vi: "trên bản tin"
    examples:
      - text: "I saw him {{on the news}} last night."

  - id: hear-the-news-phrase
    headword: "hear the news"
    pos: phrase
    cefr: A2
    tags: [collocation, news]
    senses:
      - definition_en: "to be told about recent events"
        definition_vi: "nghe tin tức"
    examples:
      - text: "Did you {{hear the news}} about the earthquake?"

  - id: newspaper-noun
    headword: "newspaper"
    pos: noun
    cefr: A1
    tags: [collocation, news]
    senses:
      - definition_en: "a regularly printed document consisting of large sheets of paper that are folded together"
        definition_vi: "tờ báo"
    examples:
      - text: "He reads a {{newspaper}} every morning."

  - id: take-place-phrase
    headword: "take place"
    pos: phrase
    cefr: B1
    tags: [collocation, place]
    senses:
      - definition_en: "happen"
        definition_vi: "diễn ra"
    examples:
      - text: "The concert will {{take place}} on Saturday."

  - id: in-place-of-phrase
    headword: "in place of"
    pos: phrase
    cefr: B2
    tags: [collocation, place]
    senses:
      - definition_en: "instead of"
        definition_vi: "thay thế cho"
    examples:
      - text: "You can use milk {{in place of}} cream in this recipe."

  - id: at-a-place-phrase
    headword: "at a place"
    pos: phrase
    cefr: A2
    tags: [collocation, place]
    senses:
      - definition_en: "located in a specific area"
        definition_vi: "ở một nơi"
    examples:
      - text: "We met {{at a place}} near the station."

  - id: ask-a-question-phrase
    headword: "ask a question"
    pos: phrase
    cefr: A1
    tags: [collocation, question]
    senses:
      - definition_en: "to interrogate or inquire"
        definition_vi: "đặt câu hỏi"
    examples:
      - text: "Can I {{ask a question}} about the homework?"

  - id: answer-a-question-phrase
    headword: "answer a question"
    pos: phrase
    cefr: A1
    tags: [collocation, question]
    senses:
      - definition_en: "to respond to a query"
        definition_vi: "trả lời câu hỏi"
    examples:
      - text: "He couldn't {{answer a question}} in the test."

  - id: question-sb-verb
    headword: "question sb"
    pos: verb
    cefr: B2
    tags: [collocation, question]
    senses:
      - definition_en: "to ask someone questions"
        definition_vi: "chất vấn ai"
    examples:
      - text: "The police had to {{question}} the suspect."

  - id: in-question-phrase
    headword: "in question"
    pos: phrase
    cefr: B2
    tags: [collocation, question]
    senses:
      - definition_en: "being discussed"
        definition_vi: "đang được nhắc tới, được bàn tới"
    examples:
      - text: "The man {{in question}} is currently in police custody."

  - id: question-mark-noun
    headword: "question mark"
    pos: noun
    cefr: A2
    tags: [collocation, question]
    senses:
      - definition_en: "a punctuation mark (?) indicating a question"
        definition_vi: "dấu chấm hỏi"
    examples:
      - text: "Put a {{question mark}} at the end of the sentence."

  - id: have-a-view-phrase
    headword: "have a view"
    pos: phrase
    cefr: B2
    tags: [collocation, view]
    senses:
      - definition_en: "to hold an opinion"
        definition_vi: "có quan điểm"
    examples:
      - text: "I don't really {{have a view}} on this subject."

  - id: hold-a-view-phrase
    headword: "hold a view"
    pos: phrase
    cefr: B2
    tags: [collocation, view]
    senses:
      - definition_en: "to strongly believe an opinion"
        definition_vi: "giữ quan điểm"
    examples:
      - text: "Many experts {{hold a view}} that climate change is accelerating."

  - id: take-a-view-phrase
    headword: "take a view"
