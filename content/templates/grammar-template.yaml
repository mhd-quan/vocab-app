# Grammar import sample
# Copy this file into content/books/<book-code>/unit-NN-grammar.yaml.
# The parser stores patterns/examples/mistakes/checks in grammar topic metadata.

book: sample-b1
book_title: Sample B1 Authoring Pack

unit:
  ordinal: 99
  code: U99
  title: Full Grammar Syntax Sample
  summary_md: Demonstrates the grammar topic fields supported by the importer and Content browser.

lesson:
  ordinal: 2
  kind: grammar
  title: Present Simple vs Present Continuous
  slug: present-simple-vs-continuous

topics:
  - id: present-simple-routines
    slug: present-simple-routines
    title: Present simple for routines
    summary_md: Use present simple for habits, routines, repeated actions, and general truths.
    explanation_md: |
      Use the base verb with I/you/we/they.
      Add -s or -es with he/she/it.
      Common time expressions: always, usually, often, sometimes, every day, on Mondays.
    difficulty: 1
    estimated_minutes: 12
    tags: [tense, routines, present-simple]
    objectives:
      - Identify routines and general truths.
      - Add -s or -es after he/she/it.
    prerequisites:
      - Subject pronouns
      - Base verbs
    teacher_notes: Start with routines students can act out.
    patterns:
      - label: affirmative
        form: subject + base verb
        use: I/you/we/they routines.
        examples:
          - I study English every evening.
          - They play football on Sundays.
      - label: third-person affirmative
        form: he/she/it + verb-s/es
        use: One person's routine.
        examples:
          - She studies English every evening.
      - label: negative
        form: subject + do/does not + base verb
        use: Routines that are not true.
        examples:
          - He does not live near the school.
    examples:
      - text: She studies English every evening.
        translation: Cô ấy học tiếng Anh mỗi tối.
        explanation: A repeated routine.
        correct: true
      - text: She study English every evening.
        explanation: Missing -s after she.
        correct: false
        note: Use studies with she.
    common_mistakes:
      - wrong: She study English every evening.
        correct: She studies English every evening.
        note: Add -s or -es for he/she/it in present simple.
    checks:
      - prompt: "Rewrite with he: I watch TV after dinner."
        answer: He watches TV after dinner.
        explanation: watch becomes watches after he.
    activities:
      - kind: fill_blank
        tags: [agreement]
        sentence: She {{studies}} English every evening.
        hint: he/she/it takes -s or -es in present simple.
        explanation: Use studies after she.
        source_ref: teacher-made
      - kind: choice
        tags: [signal-words]
        question: He usually ___ TV after dinner.
        options:
          - text: watch
          - text: watches
            correct: true
          - text: is watching
        explanation: Usually describes a routine, so use present simple.
      - kind: rewrite
        prompt: I watch TV after dinner.
        instruction: Rewrite with he.
        answer: He watches TV after dinner.
      - kind: error_correction
        sentence: She study English every evening.
        answer: She studies English every evening.
        explanation: Add -s or -es for he/she/it in present simple.
    metadata:
      vietnamese_contrast: Distinguish repeated habit from action happening now.

  - id: present-continuous-now
    slug: present-continuous-now
    title: Present continuous for actions happening now
    summary_md: Use present continuous for actions in progress at the moment of speaking.
    explanation_md: |
      Use am/is/are + verb-ing.
      Common time expressions: now, right now, at the moment, today.
    difficulty: 1
    tags: [tense, now, present-continuous]
    patterns:
      - label: affirmative
        form: subject + am/is/are + verb-ing
        use: Actions happening now.
        examples:
          - I am reading a new book now.
          - They are playing outside.
      - label: negative
        form: subject + am/is/are not + verb-ing
        use: Actions not happening now.
        examples:
          - He is not watching TV at the moment.
    examples:
      - text: I am reading a new book now.
        translation: Tôi đang đọc một cuốn sách mới.
        explanation: The action is happening now.
        correct: true
      - text: I read a new book now.
        explanation: Use present continuous with now.
        correct: false
    common_mistakes:
      - wrong: He watching TV.
        correct: He is watching TV.
        note: Present continuous needs am/is/are.
    checks:
      - prompt: Make a sentence with she / write / now.
        answer: She is writing now.
    activities:
      - kind: fill_blank
        sentence: I {{am reading}} a new book now.
        accepted_answers:
          - am reading
        hint: Use am/is/are + verb-ing.
      - kind: order
        prompt: Put the words in order.
        tokens: [They, are, playing, outside, now]
        answer: They are playing outside now.
      - kind: prompted_sentence
        instruction: Write a present continuous sentence.
        words: [she, write, now]
        answer: She is writing now.
      - kind: error_correction
        sentence: He watching TV at the moment.
        answer: He is watching TV at the moment.
        explanation: Present continuous needs am/is/are.

  - id: contrast-routine-now
    slug: contrast-routine-now
    title: Contrasting routines and now
    summary_md: Choose the tense based on whether the action is regular or in progress.
    explanation_md: |
      Present simple = regular routine or general truth.
      Present continuous = temporary action happening now or around now.
      Signal words often tell you which meaning the sentence needs.
    difficulty: 2
    tags: [tense, contrast, signal-words]
    patterns:
      - label: routine plus temporary action
        form: subject + usually + present simple, but today + present continuous
        examples:
          - She usually walks to school, but today she is taking the bus.
      - label: permanent versus temporary
        form: present simple for facts; present continuous for temporary change
        examples:
          - He works in Hanoi, but this week he is working from home.
    examples:
      - text: She usually walks to school, but today she is taking the bus.
        translation: Cô ấy thường đi bộ đến trường, nhưng hôm nay cô ấy đang đi xe buýt.
        explanation: A routine is contrasted with today's temporary action.
        correct: true
    common_mistakes:
      - wrong: She usually is walking to school.
        correct: She usually walks to school.
        note: Usually points to present simple.
    checks:
      - prompt: "Choose the right form: He usually (go/goes/is going) to class at 7."
        answer: goes
        explanation: Usually describes a routine.
    activities:
      - kind: choice
        question: He usually ___ to class at 7.
        options:
          - text: go
          - text: goes
            correct: true
          - text: is going
        explanation: Usually points to present simple.
      - kind: fill_blank
        sentence: She usually walks to school, but today she {{is taking}} the bus.
        hint: Today can show a temporary action around now.
      - kind: rewrite
        prompt: She usually is walking to school.
        instruction: Correct the sentence.
        answer: She usually walks to school.
      - kind: prompted_sentence
        instruction: Write a contrast sentence with usually and today.
        words: [usually, today, bus]
        answer: She usually walks to school, but today she is taking the bus.
