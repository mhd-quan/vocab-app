# Vocab import sample
# Copy this file into content/books/<book-code>/unit-NN-vocab.yaml.
# The file intentionally exercises every currently accepted vocab enum.

book: sample-b1
book_title: Sample B1 Authoring Pack

unit:
  ordinal: 99
  code: U99
  title: Full Vocabulary Syntax Sample
  summary_md: Demonstrates all vocab fields, POS values, form kinds, collocation patterns including prep+noun, and relation kinds.

lesson:
  ordinal: 1
  kind: vocabulary
  title: Vocab Import Surface
  slug: vocab-import-surface

entries:
  - id: achievement-noun
    headword: achievement
    lemma: achievement
    pos: noun
    ipa: /əˈtʃiːvmənt/
    cefr: B1
    frequency_rank: 1200
    image_ref: images/achievement.png
    audio_ref: audio/achievement.mp3
    tags: [school, success, noun]
    metadata:
      source: template
      rarity: common
    senses:
      - definition_en: something good that you have worked hard to do
        definition_vi: thành tựu
        register: neutral
        domain: education
        notes_md: Often used with academic or personal goals.
    examples:
      - text: Passing the exam was a real {{achievement}}.
        translation: Vượt qua kỳ thi là một thành tựu thật sự.
        cloze_hint: a__________
        audio_ref: audio/examples/achievement-01.mp3
        source_ref: teacher-made
    forms:
      - kind: plural
        text: achievements
    collocations:
      - collocation: major achievement
        pattern: adj+noun
        example: Winning the prize was a major achievement.
      - collocation: academic achievement
        pattern: noun+noun
    relations:
      - relation: synonym
        text: accomplishment
      - relation: antonym
        text: failure
      - relation: hypernym
        text: success
      - relation: hyponym
        text: award

  - id: adapt-verb
    headword: adapt
    lemma: adapt
    pos: verb
    ipa: /əˈdæpt/
    cefr: B2
    tags: [change, work, verb]
    senses:
      - definition_en: to change your behavior so that you can deal with a new situation
        definition_vi: thích nghi
        register: formal
    examples:
      - text: New students need time to {{adapt}} to the course.
        translation: Học sinh mới cần thời gian để thích nghi với khóa học.
    forms:
      - kind: past
        text: adapted
      - kind: past_participle
        text: adapted
      - kind: gerund
        text: adapting
      - kind: third_person
        text: adapts
      - kind: infinitive
        text: to adapt
    collocations:
      - collocation: adapt a plan
        pattern: verb+noun
      - collocation: adapt to change
        pattern: verb+prep
      - collocation: quickly adapt
        pattern: adv+verb
    relations:
      - relation: derived_from
        text: adaptable
      - relation: confused_with
        text: adopt

  - id: accurate-adjective
    headword: accurate
    lemma: accurate
    pos: adjective
    ipa: /ˈækjərət/
    cefr: B1
    tags: [quality, adjective]
    senses:
      - definition_en: correct and true in every detail
        definition_vi: chính xác
        register: academic
    examples:
      - text: The report gives an {{accurate}} picture of the problem.
        translation: Báo cáo đưa ra một bức tranh chính xác về vấn đề.
    forms:
      - kind: comparative
        text: more accurate
      - kind: superlative
        text: most accurate
    collocations:
      - collocation: accurate in detail
        pattern: adj+prep
      - collocation: highly accurate
        pattern: adv+adj
    relations:
      - relation: see_also
        text: precise

  - id: carefully-adverb
    headword: carefully
    lemma: carefully
    pos: adverb
    cefr: A2
    tags: [adverb, manner]
    senses:
      - definition_en: with a lot of attention or thought
        definition_vi: một cách cẩn thận
        register: neutral
    examples:
      - text: Read the instructions {{carefully}} before you answer.

  - id: as-a-result-phrase
    headword: as a result
    pos: phrase
    cefr: B1
    tags: [linking, phrase]
    senses:
      - definition_en: because of something that happened before
        definition_vi: kết quả là
        register: formal
    examples:
      - text: It rained heavily; {{as a result}}, the match was cancelled.
    collocations:
      - collocation: as a result of
        pattern: noun+prep

  - id: break-the-ice-idiom
    headword: break the ice
    pos: idiom
    cefr: B2
    tags: [conversation, idiom]
    senses:
      - definition_en: to make people feel more relaxed in a social situation
        definition_vi: phá vỡ sự ngại ngùng ban đầu
        register: informal
    examples:
      - text: A short game can {{break the ice}} at the start of class.
    collocations:
      - collocation: a way to break the ice
        pattern: other

  - id: pressure-noun
    headword: pressure
    lemma: pressure
    pos: noun
    cefr: B1
    tags: [work, stress, noun]
    senses:
      - definition_en: a difficult situation that makes you feel worried or unhappy
        definition_vi: áp lực
        register: neutral
    examples:
      - text: She is under a lot of {{pressure}} at work right now.
        translation: Cô ấy đang chịu rất nhiều áp lực trong công việc ngay lúc này.
    collocations:
      - collocation: under pressure
        pattern: prep+noun
      - collocation: put pressure on
        pattern: verb+noun

  - id: look-up-phrasal_verb
    headword: look up
    lemma: look up
    pos: phrasal_verb
    cefr: B1
    tags: [study, phrasal_verb]
    senses:
      - definition_en: to search for information in a book or online
        definition_vi: tra cứu
        register: neutral
    examples:
      - text: You should {{look up}} any word you do not know.
    relations:
      - relation: synonym
        text: search for

  - id: heavy-rain-collocation
    headword: heavy rain
    pos: collocation
    cefr: A2
    tags: [weather, collocation]
    senses:
      - definition_en: a lot of rain
        definition_vi: mưa to
    examples:
      - text: The road was flooded after the {{heavy rain}}.

  - id: either-determiner
    headword: either
    pos: determiner
    cefr: B1
    tags: [choice, determiner]
    senses:
      - definition_en: one or the other of two things
        definition_vi: một trong hai
    examples:
      - text: You can choose {{either}} answer.

  - id: in-spite-of-preposition
    headword: in spite of
    pos: preposition
    cefr: B1
    tags: [contrast, preposition]
    senses:
      - definition_en: despite something
        definition_vi: mặc dù
    examples:
      - text: She smiled {{in spite of}} the bad news.

  - id: although-conjunction
    headword: although
    pos: conjunction
    cefr: A2
    tags: [contrast, conjunction]
    senses:
      - definition_en: used to introduce a fact that makes another fact surprising
        definition_vi: mặc dù
    examples:
      - text: "{{Although}} it was late, we kept studying."

  - id: theirs-pronoun
    headword: theirs
    pos: pronoun
    cefr: A2
    tags: [possession, pronoun]
    senses:
      - definition_en: belonging to them
        definition_vi: của họ
    examples:
      - text: This book is ours, and that one is {{theirs}}.

  - id: wow-interjection
    headword: wow
    pos: interjection
    cefr: A1
    tags: [reaction, interjection]
    senses:
      - definition_en: used to show surprise or admiration
        definition_vi: ôi, chà
        register: slang
    examples:
      - text: "{{Wow}}, your pronunciation is much better today!"
