[package]
name = "viterbi"
version = "0.1.0"
edition = "2021"
description = "CTC Viterbi alignment for vocab-app pronunciation scoring."
license = "UNLICENSED"
publish = false

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
